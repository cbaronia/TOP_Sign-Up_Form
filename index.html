<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign-up Form</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="side-bar">
        <div class="logo">
            <img src="./images/odin-lined.png" alt="TOP logo">
            <h1>ODIN</h1>
        </div>
        <p>Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank">Halie West</a> on <a href="https://unsplash.com/" target="_blank">Unsplash</a></p>
    </div>
    <div class="main">
        <div class="description">
            <p>
                This is not a real online service! You know you need something like this
                in your life to help you realize your deepest dreams.
                Sign up <span class="italicize">now</span> to get started.
            </p>
            <p>You <span class="italicize">know</span> you want to.</p>
        </div>
        <div class="form-section">
            <p>Let's do this!</p>
            <form id="user-form" action="post">
                <div class="form-col">
                    <div class="input_element">
                        <label for="first_name">FIRST NAME</label>
                        <input type="text" id="first_name" name="first_name" required>
                    </div>

                    <div class="input_element">
                        <label for="email">EMAIL</label>
                        <input type="email" id="email" name="email" required>
                    </div>

                    <div class="input_element">
                        <label for="password">PASSWORD</label>
                        <input class="password-field" type="password" id="password" name="password" required>
                        <p>*Passwords do not match</p>
                    </div>
                </div>

                <div class="form-col">
                    <div class="input_element">
                        <label for="last_name">LAST NAME</label>
                        <input type="text" id="last_name" name="last_name" required>
                    </div>


                    <div class="input_element">
                        <label for="phone_number">PHONE NUMBER</label>
                        <input type="tel" id="phone_number" name="phone_number" required>
                    </div>

                    <div class="input_element">
                        <label for="confirm_password">CONFIRM PASSWORD</label>
                        <input class="password-field" type="password" id="confirm_password" name="confirm_password" required>
                    </div>
                </div>

            </form>
        </div>
        <div class="end-section">
            <input type="submit" form="user-form" value="Create Account">
            <p>Already have an account? <a href="" target="_blank">Log in</a></p>
        </div>
    </div>
</body>
</html>
